[profile.default]
src = "contracts"
test = "tests/contracts"
out = "out"
solc = ".toolchain/solc-0.8.38"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "@account-abstraction/=node_modules/@account-abstraction/"]
[profile.default.fuzz]
runs = 1000
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
