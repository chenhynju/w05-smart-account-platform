name: W05 local acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.1
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: bash scripts/check.sh
      - run: npx playwright install --with-deps chromium
      - name: Real local chain, service and browser acceptance
        run: |
          mkdir -p .runtime
          anvil --silent --accounts 0 --host 127.0.0.1 --port 18555 --chain-id 31337 --hardfork cancun > .runtime/anvil.log 2>&1 &
          for n in {1..40}; do curl -fsS -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18555 && break; sleep 0.5; done
          npm run deploy:local
          npm run service > .runtime/service.log 2>&1 &
          for n in {1..40}; do curl -fsS http://127.0.0.1:4355/health && break; sleep 0.5; done
          npm run test:integration
          npm run start > .runtime/web.log 2>&1 &
          for n in {1..40}; do curl -fsS http://127.0.0.1:3155 >/dev/null && break; sleep 0.5; done
          npm run e2e
          npx tsx scripts/verify-local.ts
      # No production migration, public network broadcast or publication is performed by CI.
