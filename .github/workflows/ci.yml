name: W05 local acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.1
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: bash scripts/check.sh
      - name: Coverage, gas and dependency gates
        run: |
          forge coverage --ir-minimum --report summary --report lcov --fuzz-seed 0x4337
          python3 scripts/coverage_gate.py
          # Keep fixed-input gas exact; fuzz corpus means can vary by a few gas across runners.
          forge snapshot --match-contract AccountTest --no-match-test testFuzz --fuzz-seed 0x4337 --check
          forge snapshot --match-contract AccountTest --match-test testFuzz --fuzz-seed 0x4337 --check --tolerance 1
          npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Real local chain, service and browser acceptance
        run: |
          mkdir -p .runtime
          anvil --silent --accounts 0 --host 127.0.0.1 --port 18555 --chain-id 31337 --hardfork cancun > .runtime/anvil.log 2>&1 &
          for n in {1..40}; do curl -fsS -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18555 && break; sleep 0.5; done
          npm run deploy:local
          npm run service > .runtime/service.log 2>&1 &
          for n in {1..40}; do curl -fsS http://127.0.0.1:4355/health && break; sleep 0.5; done
          npm run test:integration
          npm run start > .runtime/web.log 2>&1 &
          for n in {1..40}; do curl -fsS http://127.0.0.1:3155 >/dev/null && break; sleep 0.5; done
          npm run e2e
          npx tsx scripts/verify-local.ts
      # No production migration, public network broadcast or publication is performed by CI.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: w05-acceptance-evidence
          path: |
            evidence/
            .gas-snapshot
            lcov.info
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: python3 scripts/bootstrap-compiler.py
      - run: python -m pip install slither-analyzer==0.11.6
      - run: python3 scripts/static_gate.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: w05-static-evidence
          path: evidence/slither-gate-*.json
